name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check app tests

      - name: Compile Check
        run: python -m compileall app alembic tests

  unit_tests:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit And Integration Tests
        env:
          DATABASE_URL: sqlite:///./ci_test.db
          JWT_SECRET: ci-test-secret
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          REFRESH_TOKEN_EXPIRE_MINUTES: "10080"
          AUTO_CREATE_TABLES: "false"
        run: pytest -q -m "not e2e"

  migration:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taskflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply Migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/taskflow
          JWT_SECRET: ci-test-secret
        run: alembic upgrade head

  e2e:
    runs-on: ubuntu-latest
    needs: [unit_tests, migration]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Env File
        run: cp .env.example .env

      - name: Build And Start Stack
        run: docker compose up --build -d

      - name: Run E2E Tests
        run: docker compose exec -T api sh -lc "E2E_BASE_URL=http://localhost:8000 pytest -q -m e2e tests/e2e"

      - name: Show Logs On Failure
        if: failure()
        run: docker compose logs --no-color

      - name: Shutdown Stack
        if: always()
        run: docker compose down -v
